<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NexoIT · Área de clientes{% endblock %}</title>
  <meta name="description" content="Área de clientes de NexoIT.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b1220">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/assets/js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__brand" href="/" aria-label="NexoIT, ir al inicio">
        <img src="/assets/img/logo-nexoit.svg" alt="NexoIT" width="132" height="32">
      </a>

      <button class="nav__toggle" type="button" data-toggle="menu" aria-controls="nav-app" aria-expanded="false" aria-label="Menú">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>

      <nav class="nav" id="nav-app" aria-label="Área de clientes">
        <a class="nav__link" href="/app/perfil">Mi cuenta</a>
        {% if user and user.rol == 'admin' %}
        <a class="nav__link" href="/app/admin">Usuarios</a>
        {% endif %}
        <a class="nav__link" href="/">← Volver al sitio</a>
        {% if user %}
        <form class="nav__logout" method="post" action="/app/logout">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="btn btn--ghost btn--small btn--icon" type="submit"
                  aria-label="Cerrar sesión" title="Cerrar sesión">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </form>
        {% endif %}
      </nav>
    </div>
  </header>

  <main id="contenido" class="app-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="site-footer__brand">
      <img src="/assets/img/logo-nexoit.svg" alt="NexoIT" width="132" height="32">
      <p>Área de clientes.</p>
    </div>
    <nav class="site-footer__links" aria-label="Familia Nexo">
      <a href="/">NexoIT</a>
      <a href="/grow/index.html">NexoGrow</a>
      <a href="/home/index.html">NexoHome</a>
    </nav>
  </footer>
</body>
</html>
