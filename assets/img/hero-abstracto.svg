<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Tres paneles de casa, cultivo y tecnología conectados a un hub</title>
  <defs>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".14"/>
      <stop offset=".55" stop-color="#2dd4bf" stop-opacity=".04"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".2"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4ade80" stop-opacity=".2"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Glow y halos -->
  <ellipse cx="400" cy="430" rx="330" ry="250" fill="url(#glowTeal)"/>
  <ellipse cx="210" cy="390" rx="145" ry="140" fill="url(#haloBlue)"/>
  <ellipse cx="400" cy="300" rx="150" ry="145" fill="url(#haloGreen)"/>
  <ellipse cx="590" cy="210" rx="145" ry="140" fill="url(#haloTeal)"/>

  <!-- Conexiones al hub -->
  <g fill="none" stroke="#2dd4bf" stroke-opacity=".26" stroke-width="1.4" stroke-linecap="round">
    <path d="M210 462 Q300 505 392 494"/>
    <path d="M400 378 Q400 440 400 472"/>
    <path d="M590 284 Q505 420 413 480"/>
  </g>

  <!-- Panel: casa -->
  <g transform="translate(210 390) rotate(-8)">
    <rect x="-75" y="-85" width="150" height="170" rx="20" fill="#111a2c" fill-opacity=".92" stroke="#60a5fa" stroke-opacity=".45"/>
    <g fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-26 -4 L0 -26 L26 -4 V26 H-26 Z"/>
      <path d="M-7 26 V9 H7 V26"/>
    </g>
  </g>

  <!-- Panel: planta -->
  <g transform="translate(400 300)">
    <rect x="-75" y="-85" width="150" height="170" rx="20" fill="#111a2c" fill-opacity=".92" stroke="#4ade80" stroke-opacity=".45"/>
    <g fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 30 V-2"/>
      <path d="M0 8 C-16 4 -20 -10 -8 -16 C-3 -9 -1 0 0 8 Z"/>
      <path d="M0 18 C16 14 20 0 8 -6 C3 1 1 10 0 18 Z"/>
      <path d="M-11 30 H11"/>
    </g>
  </g>

  <!-- Panel: laptop y circuito -->
  <g transform="translate(590 210) rotate(8)">
    <rect x="-75" y="-85" width="150" height="170" rx="20" fill="#111a2c" fill-opacity=".92" stroke="#2dd4bf" stroke-opacity=".45"/>
    <g fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-26" y="-28" width="52" height="38" rx="5"/>
      <path d="M-36 22 H36 L30 28 H-30 Z"/>
      <path d="M-13 -16 H-4 V-6 H8 V4"/>
      <circle cx="11" cy="7" r="2.5"/>
      <circle cx="-16" cy="-19" r="2.5"/>
    </g>
  </g>

  <!-- Hub central -->
  <circle cx="400" cy="490" r="58" fill="none" stroke="#2dd4bf" stroke-opacity=".12"/>
  <circle cx="400" cy="490" r="26" fill="#0d1626" stroke="#2dd4bf" stroke-opacity=".55" stroke-width="1.5"/>
  <circle cx="400" cy="490" r="12" fill="none" stroke="#2dd4bf" stroke-opacity=".3" stroke-width="6"/>
  <circle cx="400" cy="490" r="7" fill="#2dd4bf"/>

  <!-- Partículas -->
  <circle cx="132" cy="232" r="2.6" fill="#2dd4bf" opacity=".45"/>
  <circle cx="688" cy="430" r="2.2" fill="#2dd4bf" opacity=".5"/>
  <circle cx="522" cy="86" r="2" fill="#60a5fa" opacity=".45"/>
  <circle cx="286" cy="150" r="1.6" fill="#4ade80" opacity=".4"/>
  <circle cx="662" cy="520" r="2.4" fill="#e8eef7" opacity=".22"/>
</svg>
